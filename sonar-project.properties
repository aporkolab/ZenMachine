sonar.projectKey=zenmachine
sonar.projectName=ZenMachine
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=src
sonar.tests=src,tests
sonar.test.inclusions=**/*.spec.ts,tests/**/*.spec.ts
sonar.exclusions=**/*.js,node_modules/**,coverage/**,dist/**

# TypeScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions
sonar.coverage.exclusions=**/*.spec.ts,**/*.d.ts,src/main.ts,src/polyfills.ts

# Code quality settings
sonar.qualitygate.wait=true

# ESLint integration
sonar.eslint.reportPaths=eslint-report.json

# Test execution reports
sonar.testExecutionReportPaths=test-results/sonar-report.xml